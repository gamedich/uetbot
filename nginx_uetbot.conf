server {
    listen 80;
    listen [::]:80;
    server_name 213.226.124.135 213.226.124.135.sslip.io;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 213.226.124.135 213.226.124.135.sslip.io;

    ssl_certificate /etc/letsencrypt/live/213.226.124.135.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/213.226.124.135.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow embedding in Telegram WebApp iframe
    proxy_hide_header X-Frame-Options;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
